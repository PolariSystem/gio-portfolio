
  <!DOCTYPE html>
  <html lang="en">
    <head>

      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="theme-color" content="#121316" />
      <title>Giovany Cruz | Product Designer &amp; UX/UI</title>
      <meta name="description" content="Giovany Cruz's Product Design and UX/UI portfolio: SaaS, web and mobile experiences, Figma design systems, interactive prototypes and responsive frontend interfaces." />

      <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg">

      <!-- Fonts are requested from the HTML (not via CSS @import) so the browser
           can open the connection and fetch them in parallel with the bundle
           instead of waiting for the stylesheet to download and parse first. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Oswald:wght@500;700&display=swap"
      />

      <!-- Painted before any JS runs so the first frame is already the loader's
           ink colour instead of a white flash. -->
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; } html { background: #121316; }</style>

    </head>

    <body>

      <div id="root">
        <script type="module" src="/src/main.tsx">
        </script>
      </div>


    </body>
  </html>
