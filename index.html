
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Gio.Portfolio</title>
      <meta name="description" content="Showcases a modern, animated personal portfolio with smooth scrolling and interactive sections highlighting skills, projects, and contact info for professionals." />
      <meta name="robots" content="noindex, nofollow" />

      <link rel="icon" type="image/png" href="/src/assets/favicon.svg">

      <!-- Fonts are requested from the HTML (not via CSS @import) so the browser
           can open the connection and fetch them in parallel with the bundle
           instead of waiting for the stylesheet to download and parse first. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Oswald:wght@500;700&display=swap"
      />

      <!-- Painted before any JS runs so the first frame is already the loader's
           ink colour instead of a white flash. -->
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; } html { background: #121316; }</style>

    </head>

    <body>
      
      <div id="root">
        <script type="module" src="/src/main.tsx">
        </script>
      </div>
      
      
    </body>
  </html>
